<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>svg viewer</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#0b0e18}
  #stage{display:flex;align-items:center;justify-content:center;height:92vh}
  #stage svg{max-width:96vw;max-height:90vh;width:auto;height:auto}
  #bar{height:8vh;display:flex;gap:12px;align-items:center;justify-content:center;color:#8490aa;font:13px monospace}
  button{padding:4px 14px;font:13px monospace;cursor:pointer}
</style>
</head><body>
<div id="stage"></div>
<div id="bar">
  <button id="prev">prev</button>
  <span id="label"></span>
  <button id="next">next</button>
</div>
<script>
let svgs=[], idx=0;
async function init(){
  const t=await (await fetch('cog-sci/social-influence-bias/guide.html?v='+Date.now(),{cache:'no-store'})).text();
  const doc=new DOMParser().parseFromString(t,'text/html');
  // adopt guide styles so svg css classes/animations apply
  doc.querySelectorAll('style').forEach(s=>{
    const st=document.createElement('style');st.textContent=s.textContent;
    // strip body/html rules that would break the viewer layout
    document.head.appendChild(st);
  });
  document.documentElement.style.overflow='hidden';
  document.body.style.overflow='hidden';
  document.body.style.background='#0b0e18';
  svgs=[...doc.querySelectorAll('section svg')].filter(s=>(s.getAttribute('viewBox')||'').split(' ')[2]>100);
  const params=new URLSearchParams(location.search);
  idx=Math.min(svgs.length-1, parseInt(params.get('i')||'0',10));
  render();
}
function render(){
  const stage=document.getElementById('stage');
  stage.innerHTML='';
  const node=svgs[idx].cloneNode(true);
  stage.appendChild(node);
  const sec=svgs[idx].closest('section');
  const h2=sec?sec.querySelector('h2'):null;
  document.getElementById('label').textContent=(idx+1)+'/'+svgs.length+' — '+(h2?h2.textContent.slice(0,44):'');
  // restart any <animate> by forcing reflow
  stage.querySelectorAll('animate,animateTransform').forEach(a=>{try{a.beginElement&&a.beginElement()}catch(e){}});
}
document.getElementById('prev').onclick=()=>{idx=(idx-1+svgs.length)%svgs.length;render()};
document.getElementById('next').onclick=()=>{idx=(idx+1)%svgs.length;render()};
init();
</script>
</body></html>
